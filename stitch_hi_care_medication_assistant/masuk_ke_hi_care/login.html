<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>

                    "outline-variant": "#c3c6d5",
                    "on-tertiary-container": "#d5dcf4",
                    "on-secondary-fixed": "#24005b",
                    "tertiary-fixed-dim": "#bfc6dd",
                    "on-secondary": "#ffffff",
                    "surface-container": "#e6eeff",
                    "primary": "#0043a2",
                    "on-tertiary-fixed-variant": "#3f4759",
                    "on-surface-variant": "#434652",
                    "on-secondary-container": "#44208a",
                    "on-error": "#ffffff",
                    "surface-container-low": "#eff4ff",
                    "surface-variant": "#d5e3fc",
                    "secondary-fixed": "#eaddff",
                    "on-surface": "#0d1c2e",
                    "inverse-on-surface": "#eaf1ff",
                    "error-container": "#ffdad6",
                    "on-secondary-fixed-variant": "#523198",
                    "primary-fixed": "#dae2ff",
                    "on-tertiary-fixed": "#141b2c",
                    "surface-container-lowest": "#ffffff",
                    "on-primary-fixed": "#001946",
                    "on-primary-container": "#d1dcff",

                    "surface-container-highest": "#d5e3fc",
                    "surface-container-high": "#dce9ff",
                    "surface-bright": "#f8f9ff",
                    "on-primary": "#ffffff",
                    "tertiary": "#42495c",
                    "error": "#ba1a1a",
                    "primary-container": "#2a5cbe",

            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"

            "spacing": {
                    "unit": "4px",
                    "lg": "24px",
                    "xs": "4px",
                    "gutter": "16px",
                    "margin": "20px",
                    "md": "16px",
                    "sm": "8px",
                    "xl": "32px"
            },
            "fontFamily": {
                    "headline-lg": ["Manrope"],
                    "body-lg": ["Manrope"],
                    "label-sm": ["Inter"],
                    "body-md": ["Manrope"],
                    "headline-md": ["Manrope"]
            },
            "fontSize": {
                    "headline-lg": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700"}],

                    "label-sm": ["12px", {"lineHeight": "16px", "letterSpacing": "0.02em", "fontWeight": "500"}],
                    "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body {
            background-color: #f8f9ff;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="font-body-md text-on-surface selection:bg-primary-fixed selection:text-on-primary-fixed antialiased min-h-screen flex flex-col">
<!-- TopAppBar suppressed per Navigation Shell rules for Transactional/Login pages -->
<main class="flex-grow flex items-center justify-center p-gutter">
<div class="w-full max-w-[440px] flex flex-col gap-xl">
<!-- Branding Section -->
<div class="text-center space-y-sm">
<div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-primary-container text-on-primary-container mb-md shadow-sm">
<span class="material-symbols-outlined text-4xl" data-icon="health_and_safety">health_and_safety</span>
</div>
<h1 class="font-headline-lg text-headline-lg text-primary tracking-tight">HI!-CARE</h1>
<p class="font-body-md text-on-surface-variant opacity-80">
                            Baru di HI!-CARE? 
                            <a class="text-secondary font-bold hover:underline decoration-2 underline-offset-4" href="#">Daftar</a>
</p>
</div>
<!-- Login Card -->
<div class="bg-surface-container-lowest rounded-xl p-xl shadow-[0_8px_30px_rgb(0,67,162,0.04)] border border-outline-variant/30 backdrop-blur-sm">
<form class="flex flex-col gap-lg">
<!-- Form Header -->
<div class="mb-sm">
<h2 class="font-headline-md text-headline-md text-on-surface">Selamat datang kembali</h2>
<p class="font-body-md text-on-surface-variant">Masuk untuk mengakses dashboard Anda</p>
</div>
<!-- Input Fields -->
<div class="space-y-md">
<div class="group">
<label class="block font-label-sm text-label-sm text-outline mb-xs transition-colors group-focus-within:text-primary" for="identifier">Username atau Email</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline group-focus-within:text-primary transition-colors" data-icon="person">person</span>
<input class="w-full pl-12 pr-4 py-3.5 bg-surface-container-low border border-outline-variant rounded-lg focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all font-body-md text-on-surface placeholder:text-outline/50" id="identifier" placeholder="e.g. patrick_care" type="text"/>
</div>
</div>
<div class="group">
<label class="block font-label-sm text-label-sm text-outline mb-xs transition-colors group-focus-within:text-primary" for="password">Kata Sandi</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline group-focus-within:text-primary transition-colors" data-icon="lock">lock</span>
<input class="w-full pl-12 pr-12 py-3.5 bg-surface-container-low border border-outline-variant rounded-lg focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all font-body-md text-on-surface placeholder:text-outline/50" id="password" placeholder="••••••••" type="password"/>
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-outline hover:text-primary active:scale-95 transition-all" type="button">
<span class="material-symbols-outlined" data-icon="visibility">visibility</span>
</button>
</div>
</div>
</div>
<!-- Utilities -->
<div class="flex items-center justify-between">
<label class="flex items-center gap-sm cursor-pointer group">
<div class="relative flex items-center">
<input class="peer sr-only" type="checkbox"/>
<div class="w-10 h-6 bg-surface-variant rounded-full peer-checked:bg-primary transition-colors"></div>
<div class="absolute left-1 top-1 w-4 h-4 bg-white rounded-full peer-checked:translate-x-4 transition-transform shadow-sm"></div>
</div>
<span class="font-label-sm text-label-sm text-on-surface-variant group-hover:text-on-surface transition-colors">Ingat Saya</span>
</label>
<a class="font-label-sm text-label-sm text-secondary font-semibold hover:underline decoration-2 underline-offset-4" href="#">Lupa Kata Sandi?</a>
</div>
<!-- Actions -->
<div class="pt-sm">
<button class="w-full py-4 bg-primary text-on-primary font-headline-md text-body-md rounded-xl shadow-lg shadow-primary/20 hover:bg-primary-container active:scale-[0.98] transition-all duration-200" type="submit">Masuk</button>
</div>
<div class="relative flex items-center py-sm">
<div class="flex-grow border-t border-outline-variant/50"></div>
<span class="flex-shrink mx-4 font-label-sm text-label-sm text-outline uppercase tracking-widest">ATAU</span>
<div class="flex-grow border-t border-outline-variant/50"></div>
</div>
<div class="text-center">
<p class="font-body-md text-on-surface-variant">
                            Baru di HI!-CARE? 
                            <a class="text-secondary font-bold hover:underline decoration-2 underline-offset-4" href="#">Daftar</a>
</p>
</div>
</form>
</div>
<!-- Trust Badge Section -->
<div class="flex flex-col items-center gap-md">
<div class="flex gap-lg opacity-40 grayscale group-hover:grayscale-0 transition-all">
<span class="material-symbols-outlined text-3xl" data-icon="verified_user">verified_user</span>
<span class="material-symbols-outlined text-3xl" data-icon="encrypted">encrypted</span>
<span class="material-symbols-outlined text-3xl" data-icon="privacy_tip">privacy_tip</span>
</div>
<p class="font-label-sm text-label-sm text-outline text-center">Data kesehatan Anda terenkripsi dan aman. HI!-CARE mengikuti standar privasi klinis.</p>
</div>
</div>
</main>
<!-- Footer Decoration -->
<footer class="w-full p-gutter flex justify-center opacity-20">
<div class="h-1 w-32 bg-primary-fixed rounded-full"></div>
</footer>
<!-- Background Decoration Images -->
<div class="fixed inset-0 -z-10 pointer-events-none overflow-hidden">
<div class="absolute -top-24 -right-24 w-96 h-96 bg-primary/5 rounded-full blur-3xl"></div>
<div class="absolute -bottom-24 -left-24 w-96 h-96 bg-secondary/5 rounded-full blur-3xl"></div>
<!-- Subtle Abstract Image -->
<div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 opacity-[0.03] mix-blend-multiply">
<img alt="Abstract backdrop" class="w-[800px] h-auto" data-alt="A soft, abstract digital composition of fluid gradients in calming blues and purples. The visual style is ethereal and minimalist, evoking a sense of tranquility and medical precision. High-key lighting washes over the smooth curves, creating a serene environment that aligns with a modern healthcare application's visual identity." src="https://lh3.googleusercontent.com/aida-public/AB6AXuBsxcKHlLQlDtsX_qFPef4HSSz6TQqz_MST9sa_BQI3RUSY5s2mXpEQUrgepziIDJ2w0Xz5AprPiSi4H7NA9mmh1059S0AuygZYmXySMr2R4YndtAiruI6ERxPWQOmyZiac0K7DEaWLXReG1KGpIpjmrBWh5Bz2UujvTvL6pGHTq2g-PGe9_FE06noMBXw5CH8cAFiITyaWwSsuSLGwRLCIoI_UzVVSIHOcjDOE1fGcrV1gxKilW76QRh7qOR8XEE_ARPsZWLmWetGG"/>
</div>
</div>
</body></html>
